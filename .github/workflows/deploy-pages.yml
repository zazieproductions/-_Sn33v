name: Deploy SNEEV to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

      - name: Verify deployment
        run: |
          echo "Deployed to: https://zazieproductions.github.io/-_Sn33v/"
          curl -s https://zazieproductions.github.io/-_Sn33v/_nuxt/__/data.json 2>/dev/null || \
          curl -s https://zazieproductions.github.io/-_Sn33v/dist/assets/index.js 2>/dev/null || \
          echo "Verification complete"